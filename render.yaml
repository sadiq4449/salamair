# Render Blueprint: Docker monolith (Vite frontend baked into FastAPI static/).
# DATABASE_URL is injected from salamair-db (internal connection string).

databases:
  - name: salamair-db
    plan: free
    region: singapore
    databaseName: salamair_db
    user: salamair_db_user

services:
  - type: web
    name: salamair-portal
    runtime: docker
    region: singapore
    plan: free
    branch: main
    repo: https://github.com/sadiq4449/salamair
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_SSLMODE
        value: require
      - key: CORS_ORIGINS
        value: https://salamair-portal.onrender.com,https://salamair.onrender.com
      - key: CORS_ORIGIN_REGEX
        value: "https://.*\\.onrender\\.com$"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: salamair-db
          property: connectionString
